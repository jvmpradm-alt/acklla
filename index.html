<style>
:root{
  --bg:#0D0A08; --surface:#18130F; --ink:#F2E4CF; --muted:#AE9679; --line:#35291F;
  --berry:#D9A45E; --berry-soft:#3A2A19; --gold:#E6BD7A; --gold-soft:#342817;
  --ok:#93C4A2; --ok-soft:#1B2C21; --warn:#EE9F7B; --warn-soft:#3D241A;
  --gold-grad:linear-gradient(135deg,#F1CC8A 0%,#D29A55 45%,#9E6A32 100%);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 2px 14px}
header.top h1{font-size:26px;letter-spacing:.02em}
header.top h1 span{color:var(--berry)}
.sync{font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h2{font-size:19px;margin-bottom:10px}
.hero{background:var(--ink);color:var(--bg);border:none;border-radius:20px;padding:20px}
.hero .big{font-family:Marcellus,Georgia,serif;font-size:38px;line-height:1.1;margin:4px 0 2px}
.hero .sub{opacity:.75;font-size:13px}
.bar{position:relative;height:10px;border-radius:6px;background:rgba(255,255,255,.18);margin:16px 0 8px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--berry-soft);border-radius:6px}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--gold)}
.hero .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero .row3 div{font-size:12px;opacity:.8}
.hero .row3 strong{display:block;font-size:16px;opacity:1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)}
.kv.total{font-weight:700}
.kv.total span{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);min-height:44px}
.btn.primary{background:var(--berry);border-color:var(--berry);color:#fff}
.btn.wa{background:#1F8F55;border-color:#1F8F55;color:#fff}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--berry);outline-offset:2px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:none;background:none;padding:8px 10px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--berry-soft);color:var(--ink)}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .m{font-size:13px;color:var(--muted)}
.item .r{text-align:right;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:4px;vertical-align:1px}
.tag.berry{background:var(--berry-soft);color:var(--berry)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.gray{background:var(--line);color:var(--muted)}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
textarea.i{min-height:70px;resize:vertical}
.search{margin-bottom:10px}
.empty{color:var(--muted);text-align:center;padding:20px 8px;font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;border:none;background:none;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--berry)}
nav.tabs button.sell{color:#fff}
nav.tabs button.sell .ic{background:var(--berry);border-radius:14px;width:46px;height:34px;display:flex;align-items:center;justify-content:center;margin-top:-2px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,8,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:21px;margin-bottom:6px}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts .btn{flex:1}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.pick{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.money{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:13px}
.chips button.on{background:var(--berry);border-color:var(--berry);color:#fff}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}

/* ===== Tema ACKLLA preto e dourado ===== */
body{background:radial-gradient(120% 60% at 50% 0%,#241A12 0%,var(--bg) 60%) fixed,var(--bg)}
h1,h2,h3{color:var(--gold)}
.panel{background:linear-gradient(180deg,#1C1611,#15110D);border-color:var(--line)}
header.top{align-items:center}
.brand{font-family:Cinzel,Marcellus,Georgia,serif;font-weight:600;font-size:24px;letter-spacing:.14em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-family:Figtree,sans-serif;font-weight:500;font-size:10px;letter-spacing:.5em;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-top:2px}
.logo-hero{display:flex;flex-direction:column;align-items:center;padding:6px 0 18px}
.logo-hero img{width:min(76vw,300px);aspect-ratio:1;object-fit:cover;border-radius:50%;box-shadow:0 0 0 1px rgba(230,189,122,.35),0 0 48px rgba(217,164,94,.22)}
.hero{background:linear-gradient(150deg,#2A1F15 0%,#15100C 70%);color:var(--ink);border:1px solid #4A3724;border-radius:20px}
.hero .big{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{background:rgba(242,228,207,.12)}
.bar i{background:var(--gold-grad)}
.bar b{background:var(--ink)}
.btn{background:var(--surface);border-color:var(--line)}
.btn.primary{background:var(--gold-grad);border-color:#B98246;color:#1A1109}
.btn.ghost{background:transparent}
.chips button{background:var(--surface);border-color:var(--line)}
.chips button.on{background:var(--gold-grad);border-color:#B98246;color:#1A1109}
.seg{background:var(--surface)}
.seg button.on{background:var(--berry-soft);color:var(--gold)}
input.i,select.i,textarea.i{background:#110D0A;border-color:var(--line)}
nav.tabs{background:#110D0A;border-top-color:var(--line)}
nav.tabs button.sell .ic{background:var(--gold-grad);color:#1A1109}
nav.tabs button.sell{color:#1A1109}
.sheet{background:#17120E;border-top:1px solid #4A3724}
.sheet-bg{background:rgba(0,0,0,.6)}
.toast{background:var(--gold-grad);color:#1A1109}
.tag.gray{background:#2A221B;color:var(--muted)}
.seg.c button{padding:8px 4px;font-size:13px}

function confirmarPagamento(cid){
 const valor=Math.round(num(val('rp_v'))*100)/100,forma=val('rp_f');if(valor<=0){toast('Informe o valor pago');return}
 const dv=deveCliente(cid);if(valor>dv+0.004&&!confirm('Ela deve '+brl(dv)+'. A sobra de '+brl(valor-dv)+' vai virar crédito. Confirmar?'))return;
 let rest=valor;const agora=new Date().toISOString();const tocadas={};
 abertas().filter(x=>x.v.clienteId===cid).forEach(x=>{if(rest<=0.004)return;const use=Math.min(rest,x.saldo);x.p.pagoValor=Math.round((pagoParc(x.p)+use)*100)/100;if(x.p.pagoValor>=num(x.p.valor)-0.004){x.p.pago=true;x.p.pagoEm=agora}x.v.pagamentos=x.v.pagamentos||[];x.v.pagamentos.push({data:agora,valor:Math.round(use*100)/100,forma,parcela:x.p.n});tocadas[x.v.id]=x.v;rest=Math.round((rest-use)*100)/100});
 Object.values(tocadas).forEach(v=>saveItem('vendas',{...v}));
 const c=cliente(cid);let extra='';
 if(rest>0.004){saveItem('clientes',{...c,credito:Math.round((num(c.credito)+rest)*100)/100});extra='A sobra de '+brl(rest)+' virou crédito para a próxima compra.'}
 const taxa=Math.round(valor*taxaPag(forma)*100)/100;if(taxa>0)saveItem('lancamentos',{id:uid(),data:agora,tipo:'saida',categoria:'Taxas',valor:taxa,desc:'Taxa do recebimento de '+c.nome});
 registrarInter(cid,'Cobrança','Pagou '+brl(valor)+' ('+forma+')');
 const resta=deveCliente(cid);render();
 openSheet(`<h2>Pagamento registrado</h2><div class="kv"><span>Recebido</span><strong class="money">${brl(valor)}</strong></div>${taxa?`<div class="kv"><span>Taxa da maquininha</span><strong class="money">− ${brl(taxa)}</strong></div>`:''}<div class="kv total"><span>Ainda deve</span><strong class="money">${brl(resta)}</strong></div>${extra?`<p class="note" style="color:var(--ok)">${esc(extra)}</p>`:''}
 <div class="acts">${c.whats?`<a class="btn wa" target="_blank" rel="noopener" href="${waLink(c.whats,'Oi, '+primeiro(c.nome)+'! Recebemos seu pagamento de '+brl(valor)+' ('+forma+'). '+(resta>0?'Saldo restante: '+brl(resta)+'.':'Sua compra está quitada.')+' Obrigada!')}">Enviar comprovante</a>`:''}<button class="btn primary" onclick="closeSheet()">Ok</button></div>`);
}
function saldoCaixa(){
  const vend=S.vendas.reduce((a,v)=>a+recebido(v),0);
  const ent=S.lancamentos.filter(l=>l.tipo==='entrada').reduce((a,l)=>a+num(l.valor),0);
  const sai=S.lancamentos.filter(l=>l.tipo==='saida').reduce((a,l)=>a+num(l.valor),0);
  const sinais=S.encomendas.filter(e=>e.status!=='Entregue'&&e.status!=='Cancelada').reduce((a,e)=>a+num(e.sinal),0);
  return num(S.cfg.saldoInicial)+vend+ent-sai+sinais;
}

  return `<section class="panel"><h2>Grade por modelo</h2>${l.map(m=>`<div class="item" style="align-items:flex-start"><div class="grow"><div class="t">${esc(m.nome)}</div><div class="m">${m.ref?'Ref '+esc(m.ref):esc(m.cat)}</div><div style="margin-top:6px">${Object.entries(m.t).sort((a,b)=>ordemTam(a[0])-ordemTam(b[0])).map(([t,n])=>`<span class="tag ${n>0?'ok':'warn'}" style="font-size:13px;padding:4px 10px">${esc(t)} · ${n}</span>`).join('')}</div></div><div class="r t">${Object.values(m.t).reduce((a,b)=>a+b,0)} un</div></div>`).join('')||'<div class="empty">Nada neste filtro.</div>'}</section>`}

const normT=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
function importarProdutos(lista){let novos=0,somados=0,pecas=0;
  lista.forEach(np0=>{const sx=separarTam(np0);const np={...np0,tamanho:sx.tamanho,cor:sx.cor,tam:compoeTam(sx.tamanho,sx.cor)||np0.tam||''};const q=Math.max(0,Math.round(num(np.qtd)));pecas+=q;
    const ex=S.produtos.find(p=>np.ref&&p.ref===np.ref&&normT(p.tam)===normT(np.tam));
    if(ex){const qa=Math.max(0,num(ex.qtd));const custo=qa+q>0?Math.round(((qa*num(ex.custo))+(q*num(np.custo)))/(qa+q)*100)/100:num(np.custo);saveItem('produtos',{...ex,qtd:qa+q,custo});somados++}
    else{const id=np.id&&!S.produtos.some(p=>p.id===np.id)?np.id:uid();saveItem('produtos',{...np,id,qtd:q,custo:num(np.custo),criado:np.criado||new Date().toISOString()});novos++}});
  return{novos,somados,pecas};}
function importarNota(id,auto){const n=NOTAS_PENDENTES.find(x=>x.id===id);if(!n)return;const ja=(S.cfg.nfsImportadas||[]).includes(id);
  if(ja&&auto)return;if(ja&&!confirm('Este ajuste já foi aplicado. Aplicar de novo vai duplicar. Continuar?'))return;
  if(!ja&&!auto&&!confirm((n.titulo||n.nome)+'\n\n'+resumoNota(n).replace(/<[^>]+>/g,' ')+'\n\nAplicar agora?'))return;
  const msgs=[];
  if(n.produtos){const r=importarProdutos(n.produtos);msgs.push(r.pecas+' peças entraram')}
  if(n.saidas){let saiu=0;const faltou=[];n.saidas.forEach(s=>{const p=S.produtos.find(x=>x.id===s.id)||S.produtos.find(x=>x.ref===s.ref&&normT(x.tam)===normT(s.tam));if(!p||num(p.qtd)<s.qtd){faltou.push(s.nome)}if(p){const tira=Math.min(num(p.qtd),s.qtd);saveItem('produtos',{...p,qtd:num(p.qtd)-tira});saiu+=tira}});msgs.push(saiu+' peças saíram');if(faltou.length)setTimeout(()=>alert('Sem estoque para tirar (talvez já vendidas): '+faltou.join(', ')+'. Confira no Estoque.'),300)}
  if(n.ajuste){const A=n.ajuste;let mud=0;S.produtos.slice().forEach(p=>{if(A.novos.some(x=>x.id===p.id))return;if(String(p.criado||'')>=A.corte)return;const alvo=Object.prototype.hasOwnProperty.call(A.estoque,p.id)?num(A.estoque[p.id]):0;if(num(p.qtd)!==alvo){saveItem('produtos',{...p,qtd:alvo});mud++}});
    A.novos.forEach(x=>{const ex=S.produtos.find(p=>p.id===x.id);saveItem('produtos',{...(ex||{}),...x});mud++});
    const lf=A.lancFix;if(lf){const l=(S.lancamentos||[]).find(x=>String(x.desc||'').includes(lf.busca)&&Math.abs(num(x.valor)-lf.valor)<0.01);if(l)saveItem('lancamentos',{...l,data:lf.data,desc:lf.desc})}
    msgs.push(mud+' itens de estoque ajustados')}
if(n.reentrada){const R=n.reentrada;const vend={};(S.vendas||[]).forEach(v=>(v.itens||[]).forEach(it=>{const k=R.alias[it.pid]||it.pid;vend[k]=(vend[k]||0)+num(it.qtd)}));let mud=0;const neg=[];Object.keys(R.entradas).forEach(id=>{const p=S.produtos.find(x=>x.id===id);if(!p)return;const c=num(R.entradas[id])-(vend[id]||0);if(c<0)neg.push(p.nome+' '+(p.tam||''));const alvo=Math.max(0,c);if(num(p.qtd)!==alvo){saveItem('produtos',{...p,qtd:alvo});mud++}});Object.keys(R.alias).forEach(id=>{const p=S.produtos.find(x=>x.id===id);if(p&&num(p.qtd)!==0){saveItem('produtos',{...p,qtd:0});mud++}});S.cfg.reentradaAviso=neg;msgs.push(mud+' itens Excelência recalculados'+(neg.length?'. Vendidos além da nota: '+neg.join(', '):''))}
  if(n.lancamento){saveItem('lancamentos',{id:uid(),data:new Date().toISOString(),...n.lancamento});msgs.push('caixa: '+(n.lancamento.tipo==='saida'?'− ':'+ ')+brl(n.lancamento.valor))}
  S.cfg.nfsImportadas=[...new Set([...(S.cfg.nfsImportadas||[]),id])];saveCfg();toast(msgs.join(' · '));render()}
function resumoNota(n){const a=[];if(n.produtos)a.push(`Entram ${n.produtos.reduce((s,x)=>s+num(x.qtd),0)} peças (custo ${brl(n.produtos.reduce((s,x)=>s+num(x.qtd)*num(x.custo),0))})`);if(n.saidas)a.push(`Saem ${n.saidas.reduce((s,x)=>s+num(x.qtd),0)} peças: ${n.saidas.map(x=>esc(x.nome)).join(', ')}`);if(n.ajuste)a.push(`Estoque final: ${Object.values(n.ajuste.estoque).reduce((s,x)=>s+num(x),0)+n.ajuste.novos.reduce((s,x)=>s+num(x.qtd),0)} peças. Vendas não são alteradas.`);if(n.reentrada)a.push(`Lingerie Excelência: notas menos troca e vendas.`);if(n.lancamento)a.push(`Caixa: ${n.lancamento.tipo==='saida'?'saída':'entrada'} de ${brl(n.lancamento.valor)}`);return a.join('<br>')}
function importarArquivo(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);const lista=Array.isArray(o)?o:o.produtos;if(!Array.isArray(lista)||!lista.length)throw 0;
  if(o.tipo!=='acklla-produtos'&&(o.vendas||o.clientes)){toast('Esse arquivo é um backup completo. Use Restaurar backup em Caixa.');return}

function redimensionar(file,max,q){return new Promise((ok,erro)=>{const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const e=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*e));c.height=Math.max(1,Math.round(img.height*e));const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};img.onerror=()=>erro('img');img.src=rd.result};rd.onerror=()=>erro('leitura');rd.readAsDataURL(file)})}
function caixaFoto(src){return src?`<img src="${src}" alt="Foto da peça" style="width:100%;height:100%;object-fit:cover">`:'<span class="m">Sem foto</span>'}

/* ============ REPOSIÇÃO ============ */
function verbaReposicao(){const mk=mesKey(hoje()),c=S.cfg;
  const parcelaMes=parcelasPagas()<num(c.parcelasTotal)&&!S.lancamentos.some(l=>l.categoria==='Parcela lingerie'&&mesKey(l.data)===mk)?num(c.parcela):0;
  const pagas=S.lancamentos.filter(l=>l.tipo==='saida'&&mesKey(l.data)===mk&&['Embalagem','Marketing','DAS/Impostos'].includes(l.categoria)).reduce((a,l)=>a+num(l.valor),0);
  const despFalta=Math.max(0,num(c.despFixas)-pagas),caixa=saldoCaixa();
  return{caixa,parcelaMes,despFalta,reserva:num(c.reservaMin),verba:Math.max(0,caixa-parcelaMes-despFalta-num(c.reservaMin))}}
function sugestoesReposicao(){return S.produtos.map(p=>({p,v:vendidos30(p.id),q:num(p.qtd)})).filter(x=>x.v>=1&&x.q<=1).map(x=>({...x,comprar:Math.max(1,x.v-x.q),custo:Math.max(1,x.v-x.q)*num(x.p.custo)})).sort((a,b)=>b.v-a.v||a.q-b.q)}
function vReposicao(){const vb=verbaReposicao(),sg=sugestoesReposicao();let acum=0;
  const linhas=sg.map(x=>{acum+=x.custo;const cabe=acum<=vb.verba+0.004;return{...x,cabe}});
  const totalCabe=linhas.filter(x=>x.cabe).reduce((a,x)=>a+x.custo,0);
  return `<section class="panel"><h2>Quanto posso gastar</h2>
   <div class="kv"><span>Caixa disponível</span><strong class="money">${brl(vb.caixa)}</strong></div>
   ${vb.parcelaMes?`<div class="kv"><span>(−) Parcela do fornecedor deste mês</span><strong class="money">${brl(vb.parcelaMes)}</strong></div>`:''}
   <div class="kv"><span>(−) Despesas fixas que faltam no mês</span><strong class="money">${brl(vb.despFalta)}</strong></div>
   <div class="kv"><span>(−) Reserva mínima</span><strong class="money">${brl(vb.reserva)}</strong></div>
   <div class="kv total"><span>Verba para reposição</span><strong class="money" style="color:${vb.verba>0?'var(--ok)':'var(--warn)'}">${brl(vb.verba)}</strong></div></section>
  <section class="panel"><h2>Repor agora</h2>
   ${linhas.length?linhas.map(x=>`<div class="item">${x.p.foto?`<img src="${x.p.foto}" alt="" style="width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none">`:''}<div class="grow"><div class="t">${esc(x.p.nome)}</div><div class="m">${x.p.ref?'Ref '+esc(x.p.ref)+' · ':''}${esc(x.p.tam||'')}</div><div class="m">Vendeu ${x.v} em 30 dias · resta ${x.q}</div><span class="tag ${x.cabe?'ok':'warn'}">${x.cabe?'Cabe na verba':'Esperar mais vendas'}</span></div><div class="r"><div class="t">${x.comprar} un</div><div class="m money">${brl(x.custo)}</div></div></div>`).join('')+
   `<div class="kv total" style="margin-top:8px"><span>Total que cabe na verba</span><strong class="money">${brl(totalCabe)}</strong></div><button class="btn primary block" style="margin-top:10px" onclick="copiarListaReposicao()">Copiar lista para o fornecedor</button>`
   :'<div class="empty">Nenhuma peça precisa de reposição agora. Aparecem aqui as peças que venderam nos últimos 30 dias e estão com 1 unidade ou menos.</div>'}
   <p class="note">Compre só o que cabe na verba. O resto entra na próxima compra, depois de mais vendas.</p></section>`}
function copiarListaReposicao(){const vb=verbaReposicao();let acum=0;const l=sugestoesReposicao().filter(x=>{acum+=x.custo;return acum<=vb.verba+0.004});if(!l.length){toast('Nada cabe na verba agora');return}
  const t='Olá! Pedido de reposição ACKLLA Intimates:\n'+l.map(x=>`• ${x.comprar}x ${x.p.nome}${x.p.ref?' (ref '+x.p.ref+')':''}${x.p.tam?', '+x.p.tam:''}`).join('\n');copiarTexto(t);toast('Lista copiada')}
function avisoReposicao(){const n=sugestoesReposicao().length;return n?`<section class="panel"><h2>Reposição</h2><div class="kv"><span>Peças que vendem bem e estão acabando</span><strong>${n}</strong></div><button class="btn block" style="margin-top:8px" onclick="tab='estoque';sub.estoque='Repor';render()">Ver o que repor</button></section>`:''}

/* ============ FECHAMENTO DO MÊS ============ */
function mesesDisponiveis(){const out=[],d=hoje();for(let i=0;i<6;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,15);out.push(mesKey(x))}return out}
const nomeMes=mk=>{const[a,m]=mk.split('-');const s=new Date(Number(a),Number(m)-1,15).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)};
function dadosFechamento(mk){const r=resumoMes(mk);
  const formas={};r.vs.forEach(v=>{const fs=(v.formas&&v.formas.length)?v.formas:[{forma:v.pagamento,valor:num(v.bruto)-num(v.desconto)}];fs.forEach(f=>{formas[f.forma]=(formas[f.forma]||0)+num(f.valor)})});
  let recebido=0;S.vendas.forEach(v=>{if(mesKey(v.data)===mk)recebido+=temPrazo(v)?num(v.aVista!=null?v.aVista:v.entrada):num(v.liquido);(v.pagamentos||[]).forEach(g=>{if(mesKey(g.data)===mk)recebido+=num(g.valor)})});
  const despCat={};S.lancamentos.filter(l=>l.tipo==='saida'&&mesKey(l.data)===mk).forEach(l=>{despCat[l.categoria]=(despCat[l.categoria]||0)+num(l.valor)});
  const prod={};r.vs.forEach(v=>(v.itens||[]).forEach(i=>{const k=i.nome+(i.pid?'|'+i.pid:'');prod[k]=prod[k]||{nome:i.nome,qtd:0,valor:0,lucro:0};prod[k].qtd+=num(i.qtd);const val=num(i.preco)*num(i.qtd)-num(i.desc);prod[k].valor+=val;prod[k].lucro+=val-num(i.custo)*num(i.qtd)}));
  const top=Object.values(prod).sort((a,b)=>b.valor-a.valor).slice(0,10);
  const parados=S.produtos.filter(p=>num(p.qtd)>0&&giro(p)&&giro(p)[0]==='Parado');
  const novos=S.clientes.filter(c=>c.criado&&mesKey(c.criado)===mk).length;
  const aReceber=abertas().reduce((a,x)=>a+x.saldo,0);
  return{mk,r,formas,recebido,despCat,top,parados,novos,aReceber,meta:num(S.cfg.metaMes),pctMeta:num(S.cfg.metaMes)?r.fat/num(S.cfg.metaMes):0}}
function htmlFechamento(mk){const d=dadosFechamento(mk),r=d.r,e=esc;
  const kv=(a,b,forte)=>`<tr${forte?' class="f"':''}><td>${a}</td><td class="n">${b}</td></tr>`;
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Fechamento ${e(nomeMes(mk))}</title><style>
  body{font:12pt/1.45 Georgia,serif;color:#1a1410;margin:28px}h1{font:600 22pt Georgia,serif;margin:0;color:#8C5A26;letter-spacing:.06em}h2{font:600 13pt Georgia,serif;color:#8C5A26;border-bottom:1px solid #C79A5E;padding-bottom:4px;margin:22px 0 8px}
  .sub{color:#6B5238;margin:4px 0 0}table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;border-bottom:1px solid #e3d6c3;text-align:left;font-size:11pt}th{font-weight:600;color:#6B5238}.n{text-align:right;white-space:nowrap}tr.f td{font-weight:700;border-top:2px solid #C79A5E}
  .cols{display:flex;gap:24px}.cols>div{flex:1}</style></head><body>
  <h1>ACKLLA INTIMATES</h1><p class="sub">Fechamento de ${e(nomeMes(mk))} · gerado em ${new Date().toLocaleDateString('pt-BR')}</p>
  <h2>Resultado</h2><table>${kv('Faturamento',brl(r.fat))}${kv('(−) Taxas de cartão',brl(r.taxas))}${kv('Receita líquida',brl(r.liq))}${kv('(−) Custo das peças vendidas',brl(r.cmv))}${kv('Margem de contribuição',brl(r.mc))}${kv('(−) Despesas do mês',brl(r.desp))}${kv('Lucro',brl(r.lucro),true)}</table>
  <h2>Indicadores</h2><table>${kv('Vendas',r.vs.length)}${kv('Peças vendidas',r.pecas)}${kv('Ticket médio',brl(r.ticket))}${kv('Meta do mês',brl(d.meta)+' ('+Math.round(d.pctMeta*100)+'% atingido)')}${kv('Dinheiro que entrou no mês',brl(d.recebido))}${kv('A receber das vendas a prazo (hoje)',brl(d.aReceber))}${kv('Clientes novas cadastradas',d.novos)}</table>
  <div class="cols"><div><h2>Formas de pagamento</h2><table>${Object.entries(d.formas).sort((a,b)=>b[1]-a[1]).map(([k,v])=>kv(e(k),brl(v))).join('')||kv('Sem vendas','')}</table></div>
  <div><h2>Saídas do caixa</h2><table>${Object.entries(d.despCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>kv(e(k),brl(v))).join('')||kv('Sem saídas','')}</table></div></div>
  <h2>Peças mais vendidas</h2><table><tr><th>Peça</th><th class="n">Qtd</th><th class="n">Vendido</th><th class="n">Lucro</th></tr>${d.top.map(p=>`<tr><td>${e(p.nome)}</td><td class="n">${p.qtd}</td><td class="n">${brl(p.valor)}</td><td class="n">${brl(p.lucro)}</td></tr>`).join('')||'<tr><td colspan="4">Sem vendas no mês</td></tr>'}</table>
  <h2>Peças paradas há mais de 30 dias</h2><table>${d.parados.map(p=>kv(e(p.nome)+(p.tam?' ('+e(p.tam)+')':''),num(p.qtd)+' un · '+brl(precoPix(p)))).join('')||kv('Nenhuma','')}</table>
  </body></html>`}
function gerarPdfMes(){const mk=val('fm_mes')||mesKey(hoje());const html=htmlFechamento(mk);
  if(window.AndroidApp&&typeof AndroidApp.imprimirHtml==='function'){AndroidApp.imprimirHtml(html,'ACKLLA fechamento '+mk);toast('Escolha "Salvar como PDF" na tela de impressão');return}
  baixar('acklla-fechamento-'+mk+'.html',html,'text/html')}
function gerarPlanilhaMes(){const mk=val('fm_mes')||mesKey(hoje());const d=dadosFechamento(mk),r=d.r;const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',n=v=>num(v).toFixed(2).replace('.',',');
  const L=[];const add=(...c)=>L.push(c.map(q).join(';'));
  add('ACKLLA Intimates · Fechamento',nomeMes(mk));add();add('RESULTADO','Valor (R$)');
  [['Faturamento',r.fat],['Taxas de cartão',r.taxas],['Receita líquida',r.liq],['Custo das peças vendidas',r.cmv],['Margem de contribuição',r.mc],['Despesas do mês',r.desp],['Lucro',r.lucro],['Dinheiro que entrou no mês',d.recebido],['A receber (hoje)',d.aReceber]].forEach(([a,b])=>add(a,n(b)));
  add('Vendas',r.vs.length);add('Peças vendidas',r.pecas);add('Ticket médio',n(r.ticket));add();
  add('FORMA DE PAGAMENTO','Valor (R$)');Object.entries(d.formas).forEach(([k,v])=>add(k,n(v)));add();
  add('SAÍDAS DO CAIXA','Valor (R$)');Object.entries(d.despCat).forEach(([k,v])=>add(k,n(v)));add();
  add('VENDAS DO MÊS');add('Data','Cliente','Peças','Pagamento','Total','Taxa','Custo','Lucro','Em aberto');
  r.vs.slice().sort((a,b)=>a.data.localeCompare(b.data)).forEach(v=>add(dataBR(v.data),cliente(v.clienteId)?.nome||'',(v.itens||[]).map(i=>i.qtd+'x '+i.nome).join(' | '),v.pagamento,n(num(v.bruto)-num(v.desconto)),n(v.taxa),n(v.custoTotal),n(v.lucro),n(saldoVenda(v))));add();
  add('PEÇAS MAIS VENDIDAS');add('Peça','Qtd','Vendido','Lucro');d.top.forEach(p=>add(p.nome,p.qtd,n(p.valor),n(p.lucro)));
  baixar('acklla-fechamento-'+mk+'.csv','﻿'+L.join('\n'),'text/csv')}
function painelFechamento(){return `<section class="panel"><h2>Fechamento do mês</h2>
  <label class="f" style="margin-top:0">Mês</label><select class="i" id="fm_mes">${mesesDisponiveis().map((m,i)=>`<option value="${m}" ${i===0?'selected':''}>${nomeMes(m)}</option>`).join('')}</select>
  <div class="grid2" style="margin-top:10px"><button class="btn primary" onclick="gerarPdfMes()">Gerar PDF</button><button class="btn" onclick="gerarPlanilhaMes()">Gerar planilha</button></div>
  <p class="note">O PDF traz resultado, indicadores, formas de pagamento, saídas, peças mais vendidas e paradas. A planilha abre no Google Planilhas ou Excel, com todas as vendas do mês.</p></section>`}

/* ============ LER NOTA COM IA ============ */
const MODELOS_IA=[['claude-sonnet-5-5','Claude Sonnet 5.5 (recomendado)'],['claude-opus-5-5','Claude Opus 5.5 (mais preciso)'],['claude-haiku-4-5-20251001','Claude Haiku 4.5 (mais barato)']];
function cfgIA(){try{return JSON.parse(localStorage.getItem('acklla-ia')||'{}')}catch(e){return{}}}
function salvarCfgIA(o){try{localStorage.setItem('acklla-ia',JSON.stringify({...cfgIA(),...o}))}catch(e){}}
const PROMPT_NOTA=`Você recebe foto(s) de uma nota fiscal de compra de mercadorias para revenda de uma loja de moda íntima e semijoias. Extraia os itens e responda SOMENTE com JSON válido, sem nenhum texto antes ou depois, neste formato:
{"fornecedor":"","numero":"","data":"AAAA-MM-DD","total_nota":0,"itens":[{"ref":"","nome":"","cat":"Lingerie","tam":"","qtd":1,"custo":0}],"brindes":[""],"observacoes":""}
Regras:
1. Um item por combinação de produto, tamanho e cor ou variação.
2. ref = código do produto. nome em formato de título (ex.: Conjunto Luna, Kit 3 Calças Bella).
3. cat = "Lingerie" para roupas íntimas, camisolas, pijamas, cuecas e kits; "Semijoia" para brincos, colares, pulseiras, anéis e gargantilhas; "Outro" para o resto.
4. tam = "TAMANHO, COR" (ex.: "M, Preto"). O tamanho é a coluna (PP, P, M, G, GG, XG) onde está a quantidade daquela linha. Semijoias podem ficar sem tamanho.
5. custo = valor unitário líquido em reais, número com ponto decimal, já com os descontos da nota rateados proporcionalmente entre os itens.
6. Não inclua brindes (itens com valor total zero ou listados como brinde); liste os nomes deles em "brindes".
7. total_nota = valor líquido pago na nota.
8. Se algo estiver ilegível, faça a melhor leitura possível e explique em "observacoes".`;
function sheetLerNota(){const c=cfgIA();
  openSheet(`<h2>Ler nota de compra</h2>
  <p class="note" style="margin-top:0">Fotografe a nota (uma foto por página). A inteligência artificial lê os itens, tamanhos e custos, e você confere antes de entrar no estoque. Precisa de internet.</p>
  ${c.chave?`<div class="kv"><span>Chave da IA</span><strong>configurada · <button class="btn small ghost" onclick="salvarCfgIA({chave:''});sheetLerNota()">Trocar</button></strong></div>`:`<label class="f">Chave da API Anthropic</label><input class="i" id="ia_k" autocapitalize="none" placeholder="sk-ant-..." ><p class="note">Crie em console.anthropic.com, em API Keys. O custo é cobrado lá, por nota lida. A chave fica só neste celular e não vai no backup.</p>`}
  <label class="f">Modelo</label><select class="i" id="ia_m" onchange="salvarCfgIA({modelo:this.value})">${MODELOS_IA.map(([v,l])=>`<option value="${v}" ${(c.modelo||MODELOS_IA[0][0])===v?'selected':''}>${l}</option>`).join('')}</select>
  <label class="btn primary block" style="margin-top:12px;cursor:pointer">Fotografar ou escolher a nota<input type="file" accept="image/*" multiple style="display:none" onchange="lerNota(this)"></label>
  <p class="note" id="ia_st"></p>
  <div class="acts"><button class="btn ghost" onclick="closeSheet()">Fechar</button></div>`)}
async function lerNota(inp){const fs=[...(inp.files||[])];if(!fs.length)return;
  const k=val('ia_k').trim();if(k)salvarCfgIA({chave:k});const c=cfgIA();if(!c.chave){toast('Informe a chave da API');return}
  const st=document.getElementById('ia_st');const setSt=t=>{if(st)st.textContent=t};
  setSt('Preparando '+fs.length+' foto(s)...');let imgs=[];try{for(const f of fs.slice(0,6))imgs.push(await redimensionar(f,1600,0.85))}catch(e){setSt('Não consegui abrir a foto.');return}
  const corpo={model:c.modelo||MODELOS_IA[0][0],max_tokens:8000,messages:[{role:'user',content:[...imgs.map(d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:d.split(',')[1]}})),{type:'text',text:PROMPT_NOTA}]}]};
  setSt('Lendo a nota, isso leva de 20 a 60 segundos...');
  if(window.AndroidApp&&typeof AndroidApp.postIA==='function'){AndroidApp.postIA(c.chave,JSON.stringify(corpo));return}
  try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.chave,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(corpo)});respostaIA(r.status,await r.text())}catch(e){respostaIA(0,String(e))}}
function respostaIA(status,texto){const st=document.getElementById('ia_st');
  if(status!==200){let m='Erro '+status;try{m=JSON.parse(texto).error.message}catch(e){}if(status===401)m='Chave inválida. Toque em Trocar e informe a chave de novo.';if(status===0)m='Sem conexão com a internet.';if(st)st.textContent=m;else toast(m);return}
  try{const o=JSON.parse(texto);const t=(o.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
    if(!Array.isArray(j.itens)||!j.itens.length)throw 0;window._nota=j;window._notaSel=j.itens.map(()=>true);previaNota()}
  catch(e){if(st)st.textContent='Não consegui entender a resposta. Tente uma foto mais nítida, com a nota inteira e reta.'}}
function previaNota(){const j=_nota;const its=j.itens.map((x,i)=>({...x,qtd:Math.max(0,Math.round(num(x.qtd))),custo:Math.round(num(x.custo)*100)/100,i}));
  const soma=its.filter(x=>_notaSel[x.i]).reduce((a,x)=>a+x.qtd*x.custo,0),tot=num(j.total_nota),dif=tot?soma-tot:0;
  openSheet(`<h2>Conferir nota</h2>
  <div class="kv"><span>Fornecedor</span><strong>${esc(j.fornecedor||'Não identificado')}</strong></div>
  <div class="kv"><span>Nota</span><strong>${esc(j.numero||'')} ${j.data?'· '+esc(String(j.data).split('-').reverse().join('/')):''}</strong></div>
  <div class="kv"><span>Peças marcadas</span><strong>${its.filter(x=>_notaSel[x.i]).reduce((a,x)=>a+x.qtd,0)}</strong></div>
  <div class="kv"><span>Soma dos custos</span><strong class="money">${brl(soma)}</strong></div>
  ${tot?`<div class="kv"><span>Total da nota</span><strong class="money">${brl(tot)}</strong></div>`:''}

function precoItem(i,p){return i.preco!=null?num(i.preco):precoPag(p,cart.pag)}
function descLinha(i,p){const s=String(i.desc||'').trim();if(!s)return 0;const base=precoItem(i,p)*i.qtd;let d=s.endsWith('%')?base*num(s.slice(0,-1))/100:num(s);return Math.round(Math.min(Math.max(d,0),base)*100)/100}
function descCart(pid,v){const i=cart.itens.find(x=>x.pid===pid);if(!i)return;i.desc=String(v).trim().replace(/\s/g,'');render()}
function precoCart(pid,v){const i=cart.itens.find(x=>x.pid===pid);if(!i)return;if(!String(v).trim())delete i.preco;else i.preco=Math.max(0,Math.round(num(v)*100)/100);render()}
function addCart(pid){const p=S.produtos.find(x=>x.id===pid);const i=cart.itens.find(x=>x.pid===pid);if(i){if(i.qtd<num(p.qtd))i.qtd++;else toast('Sem mais unidades em estoque')}else cart.itens.push({pid,qtd:1});render()}
function qtyCart(pid,d){const p=S.produtos.find(x=>x.id===pid);const i=cart.itens.find(x=>x.pid===pid);if(!i)return;i.qtd+=d;if(i.qtd>num(p.qtd)){i.qtd=num(p.qtd);toast('Limite do estoque')}if(i.qtd<=0)cart.itens=cart.itens.filter(x=>x!==i);render()}
function calcCart(){let bruto=0,custo=0;cart.itens.forEach(i=>{const p=S.produtos.find(x=>x.id===i.pid);if(!p)return;bruto+=precoItem(i,p)*i.qtd;custo+=num(p.custo)*i.qtd});bruto=Math.round(bruto*100)/100;
 let dItens=0;cart.itens.forEach(i=>{const p=S.produtos.find(x=>x.id===i.pid);if(p)dItens+=descLinha(i,p)});dItens=Math.round(dItens*100)/100;
 const dm=Math.min(num(cart.desc),bruto-dItens);const cli=cart.clienteId?cliente(cart.clienteId):null;const credUse=cart.usarCred&&cli?Math.round(Math.min(num(cli.credito),bruto-dItens-dm)*100)/100:0;const desconto=Math.round((dItens+dm+credUse)*100)/100;const total=Math.round((bruto-desconto)*100)/100;
 let partes;
 if(cart.dividir&&cart.pag2&&cart.pag2!==cart.pag){const v2=Math.round(Math.min(Math.max(num(cart.valor2),0),total)*100)/100;partes=[{forma:cart.pag,valor:Math.round((total-v2)*100)/100},{forma:cart.pag2,valor:v2}]}
 else partes=[{forma:cart.pag,valor:total}];
 partes.forEach(f=>f.taxa=Math.round(f.valor*taxaPag(f.forma)*100)/100);
 const taxa=partes.reduce((a,f)=>a+f.taxa,0);
 let prazo=partes.filter(f=>f.forma==='A prazo').reduce((a,f)=>a+f.valor,0);
 let aVista=partes.filter(f=>f.forma!=='A prazo').reduce((a,f)=>a+f.valor-f.taxa,0);
 if(prazo>0&&partes.length===1){const ent=Math.min(num(cart.entrada),total);prazo=Math.round((total-ent)*100)/100;aVista=ent}
 const liquido=Math.round((total-taxa)*100)/100;
 return{bruto,desconto,dItens,total,partes,taxa,liquido,custo,lucro:liquido-custo,credUse,prazo,aVista}}

function excluirPagamento(vid,k){
  const v=S.vendas.find(x=>x.id===vid);if(!v)return;const g=(v.pagamentos||[])[k];if(!g)return;
  if(!confirm('Excluir o pagamento de '+brl(g.valor)+' ('+g.forma+')? O valor volta a ficar em aberto.'))return;
  let rest=num(g.valor);
  const ordem=(g.parcela?v.receber.filter(p=>p.n===g.parcela):[]).concat(v.receber.slice().sort((a,b)=>b.venc.localeCompare(a.venc)));
  ordem.forEach(p=>{if(rest<=0.004)return;const pg=pagoParc(p);const tira=Math.min(pg,rest);p.pagoValor=Math.round((pg-tira)*100)/100;p.pago=p.pagoValor>=num(p.valor)-0.004;if(!p.pago)delete p.pagoEm;rest=Math.round((rest-tira)*100)/100});
  v.pagamentos.splice(k,1);
  saveItem('vendas',{...v});if(v.clienteId)registrarInter(v.clienteId,'Outro','Pagamento de '+brl(g.valor)+' excluído');
  toast('Pagamento excluído');render();verPedido(vid);
}

function salvarPedido(id){
  const v=S.vendas.find(x=>x.id===id);if(!v)return;const pz=temPrazo(v);const r2=x=>Math.round(x*100)/100;
  const itens=[];
  (v.itens||[]).forEach((i,k)=>{const q=Math.max(0,Math.round(num(val('ep_q'+k))));const delta=q-num(i.qtd);
    if(delta!==0){const p=S.produtos.find(x=>x.id===i.pid);if(p)saveItem('produtos',{...p,qtd:Math.max(0,num(p.qtd)-delta)})}
    if(q>0){const preco=r2(Math.max(0,num(val('ep_p'+k))));itens.push({...i,qtd:q,preco,desc:r2(Math.min(Math.max(0,num(val('ep_x'+k))),preco*q))})}});
  if(!itens.length){toast('O pedido precisa ter pelo menos uma peça. Para apagar tudo, use Desfazer venda.');return}
  const bruto=r2(itens.reduce((a,i)=>a+i.preco*i.qtd,0)),dIt=itens.reduce((a,i)=>a+num(i.desc),0);
  const dg=r2(Math.min(Math.max(0,num(val('ep_dg'))),bruto-dIt)),desconto=r2(dIt+dg),total=r2(bruto-desconto),custo=r2(itens.reduce((a,i)=>a+num(i.custo)*i.qtd,0));
  let formas,taxa;
  if(pz){
    const ent=r2(Math.min(Math.max(0,num(val('ep_e'))),total)),ef=val('ep_ef');
    const ps=v.receber.map((p,k)=>{const valor=r2(Math.max(0,num(val('ep_pv'+k))));const pago=r2(Math.min(Math.max(0,num(val('ep_pp'+k))),valor||Infinity));return{...p,venc:val('ep_v'+k)||p.venc,valor,pagoValor:pago}});
    const alvo=r2(total-ent),soma=r2(ps.reduce((a,p)=>a+p.valor,0)),dif=r2(alvo-soma);
    if(Math.abs(dif)>0.004){const aberta=ps.slice().reverse().find(p=>p.valor-p.pagoValor>0.004)||ps[ps.length-1];aberta.valor=r2(Math.max(aberta.pagoValor,aberta.valor+dif))}
    ps.forEach(p=>{p.pago=p.pagoValor>=p.valor-0.004;if(p.pago&&!p.pagoEm)p.pagoEm=new Date().toISOString();if(!p.pago)delete p.pagoEm});
    formas=[];if(ent>0)formas.push({forma:ef,valor:ent,taxa:r2(ent*taxaPag(ef))});formas.push({forma:'A prazo',valor:r2(total-ent),taxa:0});
    taxa=r2(formas.reduce((a,f)=>a+f.taxa,0));
    Object.assign(v,{receber:ps,entrada:ent,aVista:r2(ent-(formas[0].forma!=='A prazo'?formas[0].taxa:0))});
  }else{
    const a1=val('ep_f1'),a2=val('ep_f2');const v2=a2&&a2!==a1?r2(Math.min(Math.max(0,num(val('ep_v2'))),total)):0;
    formas=[{forma:a1,valor:r2(total-v2)}];if(v2>0)formas.push({forma:a2,valor:v2});formas=formas.filter(f=>f.valor>0||formas.length===1);
    formas.forEach(f=>f.taxa=r2(f.valor*taxaPag(f.forma)));taxa=r2(formas.reduce((a,f)=>a+f.taxa,0));
  }
  const d=val('ep_d');const data=d&&d!==dISO(v.data)?new Date(d+'T12:00:00').toISOString():v.data;
  const liquido=r2(total-taxa);
  Object.assign(v,{data,clienteId:val('ep_c'),itens,bruto,desconto,formas,pagamento:formas.map(f=>f.forma).join(' + '),taxa,liquido,custoTotal:custo,lucro:r2(liquido-custo),editado:new Date().toISOString()});
  saveItem('vendas',{...v});toast('Pedido atualizado');render();verPedido(id);
}
function estornar(id){const v=S.vendas.find(x=>x.id===id);if(!v||!confirm('Desfazer esta venda e devolver as peças ao estoque?'))return;if(v.creditoUsado){const c=cliente(v.clienteId);if(c)saveItem('clientes',{...c,credito:num(c.credito)+num(v.creditoUsado)})}if(v.bonusIndicacao){const r=cliente(v.bonusIndicacao.para);if(r)saveItem('clientes',{...r,credito:Math.max(0,num(r.credito)-num(v.bonusIndicacao.valor))})}(v.itens||[]).forEach(i=>{const p=S.produtos.find(x=>x.id===i.pid);if(p)saveItem('produtos',{...p,qtd:num(p.qtd)+num(i.qtd)})});delItem('vendas',id);toast('Venda desfeita');render()}

function tarefas(){
  const T=[];const hj=dISO(hoje());const ano=String(hoje().getFullYear());
  abertas().filter(x=>x.dias<=2&&x.cl).forEach(x=>T.push({cl:x.cl,k:'cobra',x,cls:x.dias<0?'warn':'gold',why:(x.dias<0?'Parcela vencida há '+(-x.dias)+' dias: ':x.dias===0?'Parcela vence hoje: ':'Parcela vence em '+x.dias+' dias: ')+brl(x.saldo),pri:0}));
  S.clientes.forEach(cl=>{
    const s=statsCliente(cl);
    if(cl.proximoContato&&cl.proximoContato<=hj)T.push({cl,k:'follow',cls:'berry',why:'Retorno combinado'+(cl.proximoMotivo?': '+cl.proximoMotivo:'')+(cl.proximoContato<hj?' (atrasado)':''),pri:1});
    const ultV=s.vs.slice().sort((a,b)=>b.data.localeCompare(a.data))[0];
    if(ultV){const d=diasEntre(ultV.data,hoje());
      if(d>=S.cfg.diasPosVenda&&d<=10&&!teveInter(cl.id,'Pós-venda',ultV.data))T.push({cl,k:'posvenda',cls:'ok',why:'Comprou há '+d+' dias: perguntar se gostou',pri:2});
      else if(s.compras===1&&d>=11&&d<=30&&!teveInter(cl.id,'Cupom 2ª compra',ultV.data))T.push({cl,k:'cupom',cls:'berry',why:'1ª compra há '+d+' dias: oferecer cupom',pri:3});
    }
    if(aniverMes(cl)&&!teveInter(cl.id,'Aniversário',ano))T.push({cl,k:'aniver',cls:'gold',why:'Aniversário em '+cl.aniversario,pri:2});
    if(s.sumida&&!teveInter(cl.id,'Reativação',dISO(addDias(hoje(),-30))))T.push({cl,k:'volta',cls:'warn',why:'Sem comprar há '+diasEntre(s.ult,hoje())+' dias',pri:4});
    if(!s.compras&&estagio(cl)!=='Perdido'&&!cl.proximoContato){const ui=interDe(cl.id)[0];const ref=ui?ui.data:cl.criado;if(ref&&diasEntre(ref,hoje())>=3)T.push({cl,k:'lead',cls:'gray',why:(estagio(cl)==='Negociando'?'Negociação parada há ':'Lead sem retorno há ')+diasEntre(ref,hoje())+' dias',pri:5})}

const temNuvem=()=>!!(window.AndroidApp&&typeof AndroidApp.gravarBackup==='function');

function infoBk(){try{return JSON.parse(localStorage.getItem('acklla-bk')||'{}')}catch(e){return{}}}
function backupAuto(forcar){
  if(!temNuvem()||_gravando)return;const dest=destinoNuvem();if(!dest)return;
  const ult=infoBk().em?new Date(infoBk().em).getTime():0;
  if(!forcar&&!_sujo&&Date.now()-ult<24*3600*1000)return;

/* ============ CAIXAS SEPARADOS (desde a data de corte) ============ */
const CX=['Reposição','Despesas','Reserva','Pró-labore','Marketing'];
const CX_DESC={'Reposição':'custo das peças vendidas, paga notas e compras','Despesas':'DAS, embalagem, entrega, taxas','Reserva':'saldo de abertura e sobra da margem','Pró-labore':'sua retirada','Marketing':'anúncios e brindes'};
const CAT_CX={'Parcela lingerie':'Reposição','Parcela de nota':'Reposição','Reposição de estoque':'Reposição','Compra encomenda':'Reposição','Embalagem':'Despesas','DAS/Impostos':'Despesas','Frete':'Despesas','Taxas':'Despesas','Outros':'Despesas','Marketing':'Marketing','Pró-labore':'Pró-labore','Aporte próprio':'Reserva','Outra entrada':'Reserva'};
const caixaDoLanc=l=>l.caixa||CAT_CX[l.categoria]||(l.tipo==='saida'?'Despesas':'Reserva');
const posCorte=d=>!S.cfg.corte||String(d)>=S.cfg.corte;
function eventosVenda(v){const ev=[];
  if(!temPrazo(v))ev.push([v.data,num(v.liquido)]);
  else{const av=num(v.aVista!=null?v.aVista:v.entrada);if(av>0)ev.push([v.data,av]);(v.pagamentos||[]).forEach(g=>ev.push([g.data,num(g.valor)]))}
  return ev.filter(([d])=>posCorte(d))}
function caixas(){
  const pct=S.cfg.caixasPct||DEF_CFG.caixasPct;const cx={'Reposição':0,'Despesas':0,'Pró-labore':0,'Marketing':0};
  S.vendas.forEach(v=>{const t=Math.max(0.01,totalVenda(v));eventosVenda(v).forEach(([d,L])=>{const rep=Math.min(L,num(v.custoTotal)*L/t);const m=L-rep;cx['Reposição']+=rep;['Despesas','Pró-labore','Marketing'].forEach(k=>cx[k]+=m*num(pct[k]))})});
  S.lancamentos.forEach(l=>{if(!posCorte(l.data))return;const v=num(l.valor);
    if(l.tipo==='transf'){if(l.de in cx)cx[l.de]-=v;if(l.para in cx)cx[l.para]+=v;return}
    const k=caixaDoLanc(l);if(k in cx)cx[k]+=(l.tipo==='saida'?-1:1)*v});
  const total=saldoCaixa();cx['Reserva']=total-cx['Reposição']-cx['Despesas']-cx['Pró-labore']-cx['Marketing'];
  return{cx,total};
}
function painelCaixas(){const K=caixas(),pct=S.cfg.caixasPct||DEF_CFG.caixasPct;
  return `<section class="panel"><h2>Seus caixas</h2>

  <div class="kv total"><span>Total (igual ao disponível)</span><strong class="money">${brl(K.total)}</strong></div>

  <p class="note">Desde ${S.cfg.corte?dataBR(S.cfg.corte):'hoje'}, cada recebimento manda o custo das peças para Reposição e divide a margem pelos percentuais. O saldo que já existia ficou na Reserva. Cada saída sai do caixa escolhido no lançamento.</p></section>`}

  ${c.pago?`<p class="note">Paga em ${dataBR(c.pagoEm)}.</p>`:''}
  <div class="acts">${id?`<button class="btn" onclick="excluirConta('${id}')">Excluir</button>${c.pago?`<button class="btn" onclick="reabrirConta('${id}')">Reabrir</button>`:''}`:''}<button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn primary" onclick="salvarConta('${id||''}')">Salvar</button></div>`)}
function salvarConta(id){const v=Math.round(num(val('kv'))*100)/100;if(!v){toast('Informe o valor');return}const base={desc:val('kd').trim()||val('kc'),fornecedor:val('kf').trim(),cat:val('kc'),caixa:val('kx')};
  if(id){const old=S.contas.find(x=>x.id===id);saveItem('contas',{...old,...base,valor:v,venc:val('kve')||old.venc});if(old.lancId){const l=S.lancamentos.find(x=>x.id===old.lancId);if(l)saveItem('lancamentos',{...l,valor:v,categoria:base.cat,caixa:base.caixa})}}
  else{const n=Math.max(1,Math.min(48,Math.round(num(val('kn'))||1))),iv=Math.max(1,Math.round(num(val('ki'))||30)),v1=val('kve')||dISO(hoje());for(let i=0;i<n;i++)saveItem('contas',{...base,id:uid()+i,parc:n>1?(i+1)+'/'+n:'',valor:v,venc:dISO(addDias(dVenc(v1),iv*i)),pago:false,criado:new Date().toISOString()})}
  closeSheet();toast('Conta salva');render()}
function pagarConta(id){const c=S.contas.find(x=>x.id===id);if(!c)return;if(!confirm('Registrar o pagamento de '+brl(c.valor)+' ('+c.desc+(c.parc?' '+c.parc:'')+') saindo do caixa '+(c.caixa||CAT_CX[c.cat]||'Despesas')+'?'))return;const lid=uid();
  saveItem('lancamentos',{id:lid,data:new Date().toISOString(),tipo:'saida',categoria:c.cat,caixa:c.caixa||CAT_CX[c.cat]||'Despesas',valor:num(c.valor),desc:c.desc+(c.parc?' '+c.parc:''),contaId:c.id});saveItem('contas',{...c,pago:true,pagoEm:new Date().toISOString(),lancId:lid});toast('Conta paga');render()}
function reabrirConta(id){const c=S.contas.find(x=>x.id===id);if(!c||!confirm('Reabrir esta conta? O pagamento sai do caixa.'))return;if(c.lancId)delItem('lancamentos',c.lancId);const n={...c,pago:false};delete n.pagoEm;delete n.lancId;saveItem('contas',n);closeSheet();toast('Conta reaberta');render()}
function excluirConta(id){const c=S.contas.find(x=>x.id===id);if(!c||!confirm('Excluir esta conta?'+(c.pago?' O pagamento também sai do caixa.':'')))return;if(c.lancId)delItem('lancamentos',c.lancId);delItem('contas',id);closeSheet();toast('Conta excluída');render()}

/* ============ PREÇOS E BASE DE FATURAMENTO ============ */
function analisePreco(){const m=Math.min(1,Math.max(0,num(S.cfg.mixCartao))),tx=num(S.cfg.taxaCartao);let sc=0,sv=0,sk=0,sa=0;
  S.produtos.forEach(p=>{const q=num(p.qtd);if(q<=0||precoPix(p)<=0)return;sc+=q*(num(p.custo)||custoNota(p));sv+=q*precoPix(p);sk+=q*precoCartao(p);sa+=q*precoAntigo(p)});
  const mcV=sv?1-sc/sv:0,mcC=sk?(sk*(1-tx)-sc)/sk:0,mc=(1-m)*mcV+m*mcC,cmv=(1-m)*(sv?sc/sv:0)+m*(sk?sc/sk:0);
  const desp=num(S.cfg.despFixas),pro=num(S.cfg.proLabore);const ca=contasAbertas().filter(x=>x.dias<=30).reduce((a,x)=>a+num(x.c.valor),0);const lin=Math.max(0,num(S.cfg.parcelasTotal)-parcelasPagas())>0?num(S.cfg.parcela):0;const parc=ca+lin;
  const empate=mc>0?desp/mc:0,metaPro=mc>0?(desp+pro)/mc:0,metaParc=cmv>0?parc/cmv:0,meta=Math.max(metaPro,metaParc),venda=(1-m)*sv+m*sk;
  return{m,tx,sc,sv,sk,sa,mcV,mcC,mc,cmv,desp,pro,parc,empate,metaPro,metaParc,meta,venda,meses:meta?venda/meta:0}}
function sheetPrecos(){const c=S.cfg,a=analisePreco(),pct=v=>String(Math.round(v*1000)/10).replace('.',',')+'%';
  const ex=[20,30,40,50,60,80,100,150].map(cu=>{const p={custoNF:cu,custo:cu,cat:'Outro'};const v=precoPix(p),k=precoCartao(p);return `<div class="kv"><span>nota ${brl(cu)}</span><strong class="money">${brl(v)} · ${brl(k)} · 6x ${brl(k/6)}</strong></div>`}).join('');
  openSheet(`<h2>Preços e base de faturamento</h2>
  <label class="f">Regra por linha (à vista = nota × markup)</label>
  ${GRUPOS.map(g=>{const n=S.produtos.filter(p=>num(p.qtd)>0&&grupoDe(p)===g).reduce((x,p)=>x+num(p.qtd),0);return `<div class="kv"><span>${g} (${n} peças)</span><strong>${String((c.markupGrupo||{})[g]??2).replace('.',',')}x</strong></div>`}).join('')}
  <p class="note">No cartão o preço à vista é dividido por ${String(+(1-a.tx).toFixed(2)).replace('.',',')}: depois da taxa de ${pct(a.tx)} você recebe o mesmo que no PIX. Semijoia com preço de catálogo nunca passa dele.</p>
  <label class="f">Tabela rápida (à vista · cartão · parcela)</label>${ex}
  <label class="f">Impacto no estoque atual</label>
  <div class="kv"><span>Estoque à vista com 2x em tudo</span><strong class="money">${brl(a.sa)}</strong></div>
  <div class="kv"><span>Estoque à vista com a regra nova</span><strong class="money" style="color:var(--gold)">${brl(a.sv)}</strong></div>
  <div class="kv"><span>Margem à vista (custo real)</span><strong>${pct(a.mcV)}</strong></div>
  <div class="kv"><span>Margem no cartão, após taxa</span><strong>${pct(a.mcC)}</strong></div>
  <label class="f">Base de faturamento</label>
  <div class="grid2"><div><label class="f" style="margin-top:0">Despesas fixas do mês</label><input class="i" inputmode="decimal" value="${String(num(c.despFixas)).replace('.',',')}" onchange="S.cfg.despFixas=num(this.value);saveCfg();sheetPrecos()"></div><div><label class="f" style="margin-top:0">Pró-labore desejado</label><input class="i" inputmode="decimal" value="${String(num(c.proLabore)).replace('.',',')}" onchange="S.cfg.proLabore=num(this.value);saveCfg();sheetPrecos()"></div></div>
  <div class="kv"><span>Parcelas de estoque nos próximos 30 dias</span><strong class="money">${brl(a.parc)}</strong></div>
  <div class="kv"><span>Margem de contribuição média</span><strong>${pct(a.mc)}</strong></div>
  <div class="kv"><span>Empate (paga as despesas)</span><strong class="money">${brl(a.empate)}</strong></div>
  <div class="kv"><span>Despesas + pró-labore</span><strong class="money">${brl(a.metaPro)}</strong></div>
  <div class="kv"><span>Pagar as parcelas só com a reposição</span><strong class="money">${brl(a.metaParc)}</strong></div>
  <div class="kv total"><span>Meta mínima recomendada</span><strong class="money" style="color:var(--gold)">${brl(a.meta)}</strong></div>
  <div class="kv"><span>Estoque dura nessa meta</span><strong>${a.meses?String(Math.round(a.meses*10)/10).replace('.',',')+' meses':'sem meta'}</strong></div>
  <p class="note">Parcelas consideradas: contas a pagar dos próximos 30 dias mais a parcela da lingerie, se ainda houver.</p>
  <div class="acts"><button class="btn ghost" onclick="closeSheet()">Fechar</button><button class="btn primary" onclick="aplicarMetas()">Usar como metas</button></div>`)}
function aplicarMetas(){const a=analisePreco();if(!a.meta){toast('Preencha as despesas primeiro');return}S.cfg.metaMin=Math.ceil(a.empate/10)*10;S.cfg.metaMes=Math.ceil(a.meta/50)*50;saveCfg();toast('Metas atualizadas');closeSheet();render()}

/* ============ COBRANÇA LEVE ============ */
const COBR={
 lembrete:{t:'Antes do vencimento',f:['Oi, {nome}! Tudo bem por aí? 😊 Passando só para lembrar que a parcela de {valor} vence {quando}. Se for mais prático, pode ser no PIX. Qualquer coisa, estou por aqui!','Oi, {nome}! Como você está? Um lembrete carinhoso: {quando} vence a parcela de {valor} da sua compra na ACKLLA. Obrigada pela confiança de sempre! 💛','{nome}, oi! Espero que esteja curtindo suas peças. Só lembrando que a parcelinha de {valor} vence {quando}. Se precisar, te mando a chave PIX, tá?']},
 hoje:{t:'No dia',f:['Bom dia, {nome}! Hoje é o dia da parcela de {valor}. Se já tiver pago, pode desconsiderar, tá? E se precisar de mais uns dias, me fala que a gente combina. 😊','Oi, {nome}! Passando rapidinho porque hoje vence a parcela de {valor}. Pode ser no PIX ou do jeito que ficar melhor para você. Obrigada!','Oi, {nome}, tudo bem? Hoje vence a parcelinha de {valor} da ACKLLA. Qualquer dúvida sobre o valor ou a data, é só me chamar aqui. 💛']},
 venceu:{t:'Venceu há poucos dias',f:['Oi, {nome}! Tudo bem? Vi aqui que a parcela de {valor}, do dia {data}, ainda está em aberto. Imagino que a correria tenha atrapalhado! Consegue ver para mim quando fica bom? 😊','Oi, {nome}! Ficou pendente a parcela de {valor} do dia {data}. Se já pagou, me manda o comprovante para eu dar baixa? Se não, me diz a melhor data para você.','{nome}, oi! Só lembrando da parcela de {valor} que venceu em {data}. Sem pressa para responder agora, quando puder me fala qual dia fica melhor, combinado?']},
 atraso:{t:'Em aberto há mais tempo',f:['Oi, {nome}! Tudo certo com você? Estou organizando as contas da loja e vi que ficou em aberto {total} da sua compra. Quero facilitar: podemos dividir esse valor ou combinar uma data que caiba no seu mês. O que acha?','Oi, {nome}! Sei que às vezes o mês aperta, acontece com todo mundo. Sobre os {total} em aberto, me fala o que fica mais tranquilo para você que a gente ajusta, combinado? 💛','{nome}, oi! Passando com carinho para a gente acertar os {total} que ficaram pendentes. Pode ser em partes, do jeito que for melhor para você. Me responde quando puder?']},
 obrigado:{t:'Agradecer pagamento',f:['Recebi seu pagamento, {nome}! Muito obrigada pela confiança. 💛 {saldoFrase}','Oi, {nome}! Pagamento recebido, obrigada pelo carinho de sempre. {saldoFrase}','{nome}, obrigada! Já está tudo anotado aqui. {saldoFrase} Qualquer coisa, estou à disposição. 😊']}
};
function situacaoCob(cid){const ab=abertas().filter(x=>x.v.clienteId===cid);const venc=ab.filter(x=>x.dias<0).sort((a,b)=>a.dias-b.dias);const prox=ab.filter(x=>x.dias>=0).sort((a,b)=>a.dias-b.dias)[0];
  let et='obrigado',ref=null;if(venc.length){ref=venc[0];et=-ref.dias>7?'atraso':'venceu'}else if(prox){ref=prox;et=prox.dias===0?'hoje':'lembrete'}
  return{ab,ref,et,total:deveCliente(cid),vencTotal:venc.reduce((a,x)=>a+x.saldo,0),venc}}
function fraseCob(c,et,i){const s=situacaoCob(c.id),r=s.ref;const q=r?(r.dias===0?'hoje':r.dias===1?'amanhã':r.dias>1?'no dia '+dataBR(dVenc(r.p.venc)):'em '+dataBR(dVenc(r.p.venc))):'';const valor=r?brl(et==='venceu'&&s.venc.length>1?s.vencTotal:r.saldo):brl(s.total);
  return COBR[et].f[i].replace(/\{nome\}/g,primeiro(c.nome)).replace(/\{valor\}/g,valor).replace(/\{quando\}/g,q).replace(/\{data\}/g,r?dataBR(dVenc(r.p.venc)):'').replace(/\{total\}/g,brl(s.total)).replace(/\{saldoFrase\}/g,s.total>0.009?'Ficou faltando só '+brl(s.total)+', sem pressa.':'Sua compra está quitada!').replace(/\s+/g,' ').trim()}
function formCobranca(cid,et){const c=cliente(cid);if(!c)return;const s=situacaoCob(cid);const e=et||s.et;
  openSheet(`<h2>Mensagem para ${esc(primeiro(c.nome))}</h2>
  <div class="kv"><span>Em aberto</span><strong class="money">${brl(s.total)}</strong></div>
  ${s.venc.length?`<div class="kv"><span>Vencido</span><strong class="money" style="color:var(--warn)">${brl(s.vencTotal)}</strong></div>`:''}
  <div class="chips" style="margin:10px 0">${Object.keys(COBR).map(k=>`<button class="${k===e?'on':''}" onclick="formCobranca('${cid}','${k}')">${COBR[k].t}${k===s.et?' ✓':''}</button>`).join('')}</div>
  <p class="note" style="margin-top:0">A situação marcada com ✓ combina com o momento dela. Ajuste o texto se quiser e envie.</p>
  ${COBR[e].f.map((_,i)=>`<div class="panel" style="margin:8px 0;padding:10px;background:var(--bg)"><textarea class="i" id="cbt${i}" style="min-height:120px">${esc(fraseCob(c,e,i))}</textarea><div class="grid2" style="margin-top:8px"><button class="btn small wa" onclick="enviarCob('${cid}','cbt${i}','${e==='obrigado'?'Pós-venda':'Cobrança'}')">Enviar no WhatsApp</button><button class="btn small" onclick="copiarTexto(document.getElementById('cbt${i}').value)&&toast('Copiado')">Copiar</button></div></div>`).join('')}
  <div class="acts"><button class="btn ghost" onclick="verCliente('${cid}')">Voltar</button><button class="btn primary" onclick="closeSheet()">Fechar</button></div>`)}
function enviarCob(cid,ta,tipo){const c=cliente(cid);const t=val(ta);registrarInter(cid,tipo,t.slice(0,140));abrirLink(waLink(c.whats,t));toast('Registrado no histórico da cliente')}
/* ============ sheet ============ */
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
function openSheet(html){document.getElementById('layer').innerHTML=`<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const f=document.querySelector('.sheet input,.sheet select');if(f&&!f.value)setTimeout(()=>f.focus(),50)}
function closeSheet(){document.getElementById('layer').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

boot();
